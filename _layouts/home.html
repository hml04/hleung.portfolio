<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
    <style>
      body.home-page { padding: 40px 24px; }
      .home { max-width: 860px; margin: 0 auto; }

      /* ---- Top banner: round photo on the left, centered name + subtitle beside it ---- */
      .intro { display: flex; align-items: center; gap: 28px; margin-bottom: 44px; }
      .intro img {
        width: 130px; height: 130px; flex: none;
        border-radius: 50%; object-fit: cover;
      }
      .intro .who {
        flex: 1; min-height: 130px;
        display: flex; flex-direction: column; justify-content: center;
        text-align: center;
      }
      .intro .who h1 { margin: 0 0 8px; font-size: 38px; line-height: 1.15; }
      .intro .who p { margin: 0; font-size: 18px; line-height: 1.4; }

      /* ---- Project cards ---- */
      .project-grid {
        display: grid; gap: 18px; margin: 0 0 48px;
        grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr));
      }
      a.project-card {
        display: block; padding: 18px 20px;
        border: 1px solid #d5d5d5; border-radius: 8px; background: #fff;
        text-decoration: none; transition: border-color 0.15s, box-shadow 0.15s;
      }
      a.project-card:hover {
        border-color: #4682B4; text-decoration: none;
        box-shadow: 0 4px 14px rgba(70, 130, 180, 0.18);
      }
      a.project-card h3 { margin: 0 0 8px; font-size: 17px; line-height: 1.3; color: #4682B4; }
      a.project-card p { margin: 0; font-size: 14px; line-height: 1.55; color: #727272; }

      .home footer { margin-top: 48px; color: #999; }

      @media (max-width: 560px) {
        .intro { gap: 16px; margin-bottom: 32px; }
        .intro img { width: 84px; height: 84px; }
        .intro .who { min-height: 84px; }
        .intro .who h1 { font-size: 24px; }
        .intro .who p { font-size: 14px; }
      }
    </style>
  </head>
  <body class="home-page">
    <main class="home">

      <div class="intro">
        {% if site.logo %}
          <img src="{{ site.logo | relative_url }}" alt="Portrait of Heidi Leung" />
        {% endif %}
        <div class="who">
          <h1>{{ site.title }}</h1>
          <p>{{ page.subtitle | escape }}</p>
        </div>
      </div>

      <h2 style="color:#4682B4;">Projects</h2>
      <div class="project-grid">
        {% for p in site.data.format %}
          <a class="project-card" href="{{ p.url | relative_url }}">
            <h3>{{ p.name }}</h3>
            <p>{{ p.description }}</p>
          </a>
        {% endfor %}
      </div>

      {{ content }}

      <footer>
        <p><small>&copy; {{ site.time | date: "%Y" }} Heidi Leung</small></p>
      </footer>
    </main>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
  </body>
</html>
